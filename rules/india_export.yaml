  # PII is masked before egress (rule 5). These detectors run over free text; the
  # AD code, IEC code, SAC code, purpose code and currency codes are deliberately
  # NOT masked -- they are business identifiers, not personal data (B8 decision 4).
  pii:
    placeholder_format: "[[{kind}_{n}]]"
    detectors:
      email: '[\w.+-]+@[\w-]+\.[\w.-]+'
      gstin: '\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b'
      pan: '\b[A-Z]{5}\d{4}[A-Z]\b'
      utr: '\b[A-Z]{4}\d{7,}\b'
      # A bare 10-digit run is ambiguous: an IEC code (a business identifier that
      # must stay visible, B8 decision 4) looks identical to a 10-digit account.
      # Account numbers require 11-18 digits and must not directly follow a '+',
      # so the digit body of an international phone falls through to `phone`.
      account: '(?<![\d+])\d{11,18}(?!\d)'
      # Phones must carry a leading '+' or an internal separator; otherwise a
      # plain 10-digit run (e.g. an IEC code) would be misread as a phone number.
      phone: '(?<!\d)(?=\+|\d[\d\s-]*[-\s])\+?\d[\d\s-]{7,}\d(?!\d)'
