deadlines:
  service_edf_submission:
    description: "Deadline to submit Export Declaration Form (EDF) for service exports to Specified Authority"
    period_type: "calendar_days_from_end_of_invoice_month"
    days: 30
    regulation_reference: "Regulation 3(2)"
    source: "FEMA 23(R)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

  realisation_period_standard:
    description: "Time limit to realise and repatriate full export proceeds in foreign currency (USD, EUR, GBP, etc.)"
    period_type: "months_from_invoice_date"
    months: 9
    regulation_reference: "Regulation 5(1)(b)"
    source: "FEMA 23(R)/(1)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

  realisation_period_inr_settlement:
    description: "Time limit to realise and repatriate export proceeds invoiced and settled in Indian Rupees (INR)"
    period_type: "months_from_invoice_date"
    months: 12
    regulation_reference: "First Proviso to Regulation 5(1)"
    source: "FEMA 23(R)/(1)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

  idpms_service_import_reporting:
    description: "AD bank timeframe to enter service import data into IDPMS for non-individual transactions > ₹10 Lakh"
    period_type: "working_days_from_document_receipt"
    days: 5
    regulation_reference: "Regulation 18(1)(d)"
    source: "FEMA 23(R)/(2)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

provisions_10_lakh:
  # The four distinct ₹10 Lakh statutory provisions across Regulations 3, 4, 6 and 18:
  deemed_edf_submission_non_individual:
    statutory_context: "Export Declaration Form (EDF) Deemed Submission"
    regulation_reference: "Regulation 3(2), Second Proviso (b)"
    threshold_inr: 1000000
    beneficiary: "Persons other than resident individuals (Companies, LLPs, Partnership Firms)"
    rule: "Inward service remittance <= ₹10 Lakh is deemed to have submitted EDF upon furnishing payment-receipt details to AD bank."
    source: "FEMA 23(R)/(2)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

  edpms_entry_closure:
    statutory_context: "EDPMS Open Entry Knock-Off / Closure upon Realisation"
    regulation_reference: "Regulation 4(2) & A.P. (DIR Series) Circular No. 20"
    threshold_inr: 1000000
    beneficiary: "All Exporters (Goods and Services)"
    rule: "AD bank may close EDPMS entry for shipping bills or invoices <= ₹10 Lakh based directly on exporter self-declaration of realization (with quarterly bulk submission option)."
    source: "FEMA 23(R)/2026-RB & Circular No. 20"
    last_verified: "2026-11-05"
    verified: true

  reduction_in_export_realisation:
    statutory_context: "Reduction in Export Value / Under-realisation / Discounts / Deductions"
    regulation_reference: "Regulation 6"
    threshold_inr: 1000000
    beneficiary: "Exporters facing shortfall or deductions in proceeds"
    rule: "AD bank may approve reduction in export value for bills <= ₹10 Lakh based on exporter self-declaration explaining bona fide commercial reason without extensive audits."
    source: "FEMA 23(R)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

  idpms_service_import_reporting:
    statutory_context: "IDPMS Service Import Data Entry Mandate for AD Banks"
    regulation_reference: "Regulation 18(1)(d)"
    threshold_inr: 1000000
    beneficiary: "Importers of cross-border services / subscriptions"
    rule: "AD banks must log service imports into IDPMS within 5 days ONLY if the importer is a non-individual AND invoice value exceeds ₹10 Lakh."
    source: "FEMA 23(R)/(2)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

thresholds:
  deemed_submission_resident_individual:
    description: "Monetary ceiling for deemed EDF submission by resident individual service exporters"
    amount_inr: null
    has_ceiling: false
    condition: "Must furnish payment receipt details to AD bank for crediting account"
    regulation_reference: "Regulation 3(2), First Proviso (a)"
    source: "FEMA 23(R)/(2)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

  deemed_submission_non_individual:
    description: "Inward remittance ceiling for deemed EDF submission by entities other than resident individuals"
    amount_inr: 1000000  # ₹10 Lakh
    has_ceiling: true
    condition: "Inward remittance per transaction/service <= ₹10 Lakh and receipt info furnished to AD bank"
    regulation_reference: "Regulation 3(2), Second Proviso (b)"
    source: "FEMA 23(R)/(2)/2026-RB"
    last_verified: "2026-11-05"
    verified: true

